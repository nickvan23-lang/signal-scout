name: Signal Scout Duo fold capture
on:
  workflow_dispatch:
  push:
    branches: [codex/duo-preflight-20261024, codex/duo-supported-readback-20261028]
permissions:
  contents: read
jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Check portable capture regressions
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 tools/test_duo_capture.py 2>&1 | tee evidence/portable-capture-checks.txt
      - name: Prepare experimental Duo configuration and record source
        timeout-minutes: 5
        run: |
          set -euo pipefail
          xcodebuild -version > evidence/xcode.txt
          xcrun simctl help > evidence/simctl-help.txt
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,subprocess
          sha256=lambda data:hashlib.sha256(data).hexdigest()
          p=Path('project.yml')
          original=p.read_bytes()
          removed=[line for line in original.decode().splitlines(True) if 'INFOPLIST_KEY_UIRequiresFullScreen' in line]
          effective=''.join(line for line in original.decode().splitlines(True) if 'INFOPLIST_KEY_UIRequiresFullScreen' not in line).encode()
          paths=subprocess.check_output(['git','ls-files','-z','--','SignalScout','project.yml','tools/capture_duo.py','tools/duoctl','.github/workflows/duo-folds.yml']).decode().split('\0')
          inputs={path:sha256(Path(path).read_bytes()) for path in paths if path}
          p.write_bytes(effective)
          Path('evidence/project-original.yml').write_bytes(original)
          Path('evidence/project-effective.yml').write_bytes(effective)
          source={
              'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'scope':'Experimental Duo Debug simulator candidate built from this checkout. UIRequiresFullScreen is removed for this experiment; this is not the submitted App Store binary or its unchanged configuration.',
              'checkedInInputSHA256':inputs,
              'projectOriginalSHA256':sha256(original),
              'projectEffectiveSHA256':sha256(effective),
              'removedConfigurationLines':[line.rstrip() for line in removed],
              'swiftCompilationConditions':['DEBUG','DUO_DIAGNOSTICS'],
              'hingeReadback':'App-observed public UIHingeInteraction callbacks with per-request session correlation; no requested-angle substitution.',
              'developerDirectory':os.environ['DEVELOPER_DIR'],
          }
          Path('evidence/source.json').write_text(json.dumps(source,indent=2)+'\n')
          PYTHON
          xcodegen generate
          cp SignalScout.xcodeproj/project.pbxproj evidence/generated-project.pbxproj
          python3 - <<'PYTHON'
          import json,subprocess,os,uuid
          from pathlib import Path
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','-j'],timeout=15))
          candidates=[(rt,d) for rt,ds in data['devices'].items() if rt.endswith('iOS-27-1') for d in ds if d['name']=='iPhone Duo' and d['isAvailable']]
          if len(candidates)!=1:raise SystemExit('Expected one available iOS 27.1 Duo')
          runtime,template=candidates[0]
          existing={d['udid'] for devices in data['devices'].values() for d in devices}
          name='SignalScout-Duo-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          device_type=template['deviceTypeIdentifier']
          help_text=subprocess.check_output(['xcrun','simctl','help','create'],text=True,timeout=15)
          Path('evidence/simctl-create-help.txt').write_text(help_text)
          creation_output=subprocess.check_output(['xcrun','simctl','create',name,device_type,runtime],text=True,timeout=60)
          Path('evidence/simulator-create-output.txt').write_text(creation_output)
          created=creation_output.strip()
          uuid.UUID(created)
          if created in existing:raise SystemExit('Refusing to use or delete a pre-existing simulator')
          ownership={'udid':created,'name':name,'deviceTypeIdentifier':device_type,'runtime':runtime,
                     'runId':os.environ['GITHUB_RUN_ID'],'runAttempt':os.environ['GITHUB_RUN_ATTEMPT'],
                     'scope':'Fresh simulator created only for this run; cleanup must match this exact receipt.'}
          Path('evidence/created-simulator.json').write_text(json.dumps(ownership,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DUO_DEVICE='+created+'\n')
          after=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j'],timeout=15))
          device=next(d for d in after['devices'][runtime] if d['udid']==created)
          if device['name']!=name or device['deviceTypeIdentifier']!=device_type:
              raise SystemExit('Created simulator identity does not match this run')
          Path('evidence/simulator.json').write_text(json.dumps({'runtime':runtime,'device':device,'template':template,'ownership':ownership},indent=2)+'\n')
          PYTHON
      - name: Build current experimental simulator candidate
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcodebuild -project SignalScout.xcodeproj -scheme SignalScout -configuration Debug -destination "platform=iOS Simulator,id=$DUO_DEVICE" -derivedDataPath "$RUNNER_TEMP/DuoDerived" -jobs 3 CODE_SIGNING_ALLOWED=NO SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG DUO_DIAGNOSTICS' build 2>&1 | tee evidence/build.log
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/DuoDerived/Build/Products/Debug-iphonesimulator/SignalScout.app" evidence/SignalScout-simulator.zip
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib,json,os,plistlib
          sha256=lambda data:hashlib.sha256(data).hexdigest()
          app=Path(os.environ['RUNNER_TEMP'])/'DuoDerived/Build/Products/Debug-iphonesimulator/SignalScout.app'
          info=plistlib.loads((app/'Info.plist').read_bytes())
          executable=app/info['CFBundleExecutable']
          if not executable.is_file():raise SystemExit('Built simulator executable is missing')
          build={
              'sourceCommit':json.loads(Path('evidence/source.json').read_text())['commit'],
              'configuration':'Debug',
              'swiftCompilationConditions':['DEBUG','DUO_DIAGNOSTICS'],
              'scope':'Unsigned experimental simulator candidate; not an App Store distribution archive. No physical BLE validation is established.',
              'bundleIdentifier':info['CFBundleIdentifier'],
              'version':info.get('CFBundleShortVersionString'),
              'buildNumber':info.get('CFBundleVersion'),
              'sdk':info.get('DTSDKName'),
              'requiresFullScreen':info.get('UIRequiresFullScreen'),
              'executableSHA256':sha256(executable.read_bytes()),
              'appFileSHA256':{str(p.relative_to(app)):sha256(p.read_bytes()) for p in sorted(app.rglob('*')) if p.is_file()},
              'archiveSHA256':sha256(Path('evidence/SignalScout-simulator.zip').read_bytes()),
              'generatedProjectSHA256':sha256(Path('evidence/generated-project.pbxproj').read_bytes()),
          }
          Path('evidence/build.json').write_text(json.dumps(build,indent=2)+'\n')
          if info.get('UIRequiresFullScreen'):raise SystemExit('The effective app still requires full screen; experimental configuration was not applied')
          PYTHON
      - name: Boot Duo and install this run's candidate
        timeout-minutes: 7
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json,os,subprocess,time
          from pathlib import Path
          device=os.environ['DUO_DEVICE']
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j'],timeout=15))
          current=next(d for devices in data['devices'].values() for d in devices if d['udid']==device)
          commands=[]
          if current['state']!='Booted':
              commands.append(('boot',['xcrun','simctl','boot',device],30))
          commands.extend([
              ('bootstatus',['xcrun','simctl','bootstatus',device,'-b'],300),
              ('install',['xcrun','simctl','install',device,str(Path(os.environ['RUNNER_TEMP'])/'DuoDerived/Build/Products/Debug-iphonesimulator/SignalScout.app')],30),
          ])
          records=[]
          try:
              for label,command,deadline in commands:
                  started=time.monotonic()
                  record={'stage':label,'command':command,'timeoutSeconds':deadline,'timedOut':False}
                  with Path('evidence',label+'.log').open('w') as output:
                      try:
                          result=subprocess.run(command,stdout=output,stderr=subprocess.STDOUT,timeout=deadline,check=False)
                          record['returnCode']=result.returncode
                          if result.returncode:raise RuntimeError(label+' exited with '+str(result.returncode))
                      except subprocess.TimeoutExpired:
                          record['timedOut']=True
                          raise
                      finally:
                          record['durationSeconds']=time.monotonic()-started
                          records.append(record)
                          Path('evidence/startup-commands.json').write_text(json.dumps(records,indent=2)+'\n')
          finally:
              diagnostics=[('simulator-after-startup',['xcrun','simctl','list','devices','available','-j']),
                           ('memory-after-startup',['vm_stat']),('load-after-startup',['uptime'])]
              for label,command in diagnostics:
                  with Path('evidence',label+'.log').open('w') as output:
                      try:subprocess.run(command,stdout=output,stderr=subprocess.STDOUT,timeout=10,check=False)
                      except subprocess.TimeoutExpired:output.write('\nDiagnostic command exceeded its 10-second deadline.\n')
          PYTHON
      - name: Capture fold transitions
        timeout-minutes: 5
        run: python3 tools/capture_duo.py --device "$DUO_DEVICE" --bundle com.nicholasvandervelden.SignalScout --out evidence/poses
      - name: Clean up only this run's simulator
        if: always() && env.DUO_DEVICE != ''
        timeout-minutes: 2
        run: |
          python3 - <<'PYTHON'
          import json,os,subprocess,uuid
          from pathlib import Path
          owner=json.loads(Path('evidence/created-simulator.json').read_text())
          device=os.environ['DUO_DEVICE']
          uuid.UUID(device)
          expected_name='SignalScout-Duo-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          if owner['udid']!=device or owner['name']!=expected_name or owner['runId']!=os.environ['GITHUB_RUN_ID'] or owner['runAttempt']!=os.environ['GITHUB_RUN_ATTEMPT']:
              raise SystemExit('Refusing cleanup without matching run-owned simulator evidence')
          results=[]
          for operation in ['shutdown','delete']:
              with Path('evidence','cleanup-'+operation+'.log').open('w') as output:
                  try:
                      result=subprocess.run(['xcrun','simctl',operation,device],stdout=output,stderr=subprocess.STDOUT,timeout=30,check=False)
                      results.append({'operation':operation,'returnCode':result.returncode,'timedOut':False})
                  except subprocess.TimeoutExpired:
                      results.append({'operation':operation,'timedOut':True})
          Path('evidence/cleanup.json').write_text(json.dumps(results,indent=2)+'\n')
          if results[-1].get('returnCode')!=0:raise SystemExit('Run-owned simulator cleanup did not complete')
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-scout-duo-folds
          path: evidence
          retention-days: 3
