name: Duo toolchain preflight
on:
  push:
    branches: [codex/duo-preflight-20261024]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Verify supported Apple toolchain
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
        run: |
          set -eu
          mkdir evidence
          sw_vers | tee evidence/macos.txt
          uname -m | tee evidence/architecture.txt
          test "$(uname -m)" = arm64
          xcodebuild -version | tee evidence/xcode.txt
          xcodebuild -showsdks > evidence/sdks.txt
          xcrun simctl list -j > evidence/simulators.json
          xcrun agent skills export --help > evidence/skill-export-help.txt 2>&1 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: duo-toolchain-preflight
          path: evidence
          retention-days: 3
